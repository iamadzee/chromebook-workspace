<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <script src="./pwa.js" defer></script>
    <title>Chromebook Tools</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1020;
            color: #f3f6ff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at 50% 0%, #1c2b54 0%, #0b1020 58%);
        }

        main {
            width: min(100%, 680px);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #93b4ff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 620px;
            margin: 0 auto;
            font-size: clamp(2rem, 5vw, 3.25rem);
            line-height: 1.12;
            letter-spacing: -0.045em;
        }

        .intro {
            margin: 18px 0 34px;
            color: #aab5cd;
            font-size: 1rem;
            line-height: 1.65;
        }

        .tools {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            text-align: left;
        }

        .tool-link {
            min-height: 76px;
            padding: 17px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #f3f6ff;
            text-decoration: none;
            background: rgba(22, 32, 57, 0.88);
            border: 1px solid #293754;
            border-radius: 14px;
            transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
        }

        .tool-link:hover {
            transform: translateY(-2px);
            background: #1c2b4b;
            border-color: #5279d9;
        }

        .tool-link:focus-visible {
            outline: 3px solid #93b4ff;
            outline-offset: 3px;
        }

        .tool-name { font-weight: 650; }
        .arrow { color: #93b4ff; font-size: 1.2rem; }

        @media (max-width: 520px) {
            body { padding: 36px 18px; }
            .tools { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">A little more capable</p>
        <h1>Small tools for your Chromebook</h1>
        <p class="intro">Simple features to make life with a restricted device a little easier.</p>
        <nav class="tools" aria-label="Available tools">
            <a class="tool-link" href="runner.html"><span class="tool-name">Python Runner</span><span class="arrow" aria-hidden="true">→</span></a>
            <a class="tool-link" href="editor.html"><span class="tool-name">Config & Hex Editor</span><span class="arrow" aria-hidden="true">→</span></a>
            <a class="tool-link" href="screenrecorder.html"><span class="tool-name">Screen Recorder</span><span class="arrow" aria-hidden="true">→</span></a>
            <a class="tool-link" href="flattener.html"><span class="tool-name">Picture Flattener</span><span class="arrow" aria-hidden="true">→</span></a>
            <a class="tool-link" href="inspector.html"><span class="tool-name">Inspector</span><span class="arrow" aria-hidden="true">→</span></a>
        </nav>
    </main>
</body>
</html>
